name: absensi
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3 # <-- Pastikan baris ini ada untuk penyimpanan sementara file Excel
  camera: ^0.11.0
  google_mlkit_face_detection: ^0.11.0
  tflite_flutter: ^0.12.1
  image: ^4.2.0
  excel: ^4.0.3
  share_plus: ^10.0.0
  shared_preferences: any
  crypto: any
  wakelock_plus: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21


flutter:
  uses-material-design: true
  assets:
    - assets/models/mobilefacenet.tflite
